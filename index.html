<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réquiem de los Smithnas - Hoja de Personaje</title>
  
  <!-- FUENTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
  	
  <!-- SDK FIREBASE REALTIME DATABASE (COMPAT) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-pergamino: #e6d3ad;
      --bg-box: rgba(244, 232, 206, 0.88);
      --border-dark: #3a1e0b;
      --border-gold: #93672b;	
      --border-gold-light: #c8a365;
      --txt-dark: #231408;
      --txt-red: #7c1414;
      --txt-gold: #583c14;
      --f-title: 'Cinzel', serif;
      --f-body: 'MedievalSharp', cursive, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #d8c298;
      background-image: 
        radial-gradient(circle at 50% 20%, #f7ecd5 0%, #e8d5b1 50%, #cbb184 100%),
        radial-gradient(circle at 10% 90%, rgba(65, 35, 10, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(65, 35, 10, 0.12) 0%, transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(50,25,5,0.03) 3px, rgba(50,25,5,0.03) 6px);
      color: var(--txt-dark);
      font-family: var(--f-body);
      font-size: 16px;
      padding: 6px 2px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .sheet-container {
      width: 100%;
      max-width: 1100px;
      background-color: var(--bg-pergamino);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255,255,255,0.5) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(70, 38, 12, 0.22) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #fbf1dc 15%, #eddab3 65%, #d1b482 100%),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(60,30,8,0.03) 3px, rgba(60,30,8,0.03) 6px);
      border: 4px double var(--border-dark);
      outline: 2px solid var(--border-gold);
      outline-offset: -4px;
      box-shadow: 
        inset 0 0 50px rgba(80, 40, 10, 0.35),
        0 6px 20px rgba(60, 30, 10, 0.45);
      padding: 14px 10px;
      position: relative;
    }

    /* BARRA DE ESTADO DE CONEXIÓN, RONDAS E IDENTIDAD */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #1c0f06;
      border: 1px solid var(--border-gold);
      padding: 5px 10px;
      margin-bottom: 8px;
      font-family: var(--f-title);
      font-size: 12px;
      color: #dfcaa2;
      gap: 8px;
    }
    .status-left-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .round-counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-gold);
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11.5px;
    }
    .round-counter-pill strong {
      color: #fde047;
      font-size: 13.5px;
    }
    .btn-round-reset {
      background: none;
      border: none;
      color: #fca5a5;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }
    .identity-selector-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .identity-selector-pill select {
      background: #2a1408;
      color: #fde047;
      border: 1px solid var(--border-gold);
      border-radius: 3px;
      padding: 2px 4px;
      font-family: var(--f-title);
      font-size: 11px;
      outline: none;
    }

    /* BANNER DE AVISOS Y MENSAJES (COLAPSABLE Y MULTILÍNEA) */
    .objective-banner {
      background: #2b1608;
      color: #faebd0;
      border: 1.5px solid var(--border-gold);
      padding: 8px 10px;
      margin-bottom: 10px;
      border-radius: 3px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    }
    .objective-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dotted rgba(218, 165, 32, 0.4);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .objective-header-title {
      font-family: var(--f-title);
      font-size: 12px;
      font-weight: bold;
      color: #ffd700;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
    }
    .objective-btn {
      background: #46250f;
      color: #faebd0;
      border: 1px solid #bf8a3b;
      padding: 2px 7px;
      font-family: var(--f-title);
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
    }

    /* MENSAJE FIJADO */
    .pinned-msg-box {
      background: rgba(115, 30, 11, 0.35);
      border: 1.5px solid #ffd700;
      border-radius: 3px;
      padding: 5px 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      font-size: 13.5px;
      color: #fff;
    }
    .pinned-msg-label {
      font-family: var(--f-title);
      font-weight: bold;
      color: #fde047;
      white-space: nowrap;
      font-size: 11.5px;
    }

    .latest-objectives-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .objective-row {
      font-family: var(--f-body);
      font-size: 13.5px;
      line-height: 1.25;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }
    .obj-time {
      color: #eab308;
      font-family: var(--f-title);
      font-size: 11px;
      flex-shrink: 0;
    }
    .obj-sender {
      color: #ffd700;
      font-family: var(--f-title);
      font-size: 11.5px;
      flex-shrink: 0;
    }
    .obj-text {
      flex: 1;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .table-msg-composer {
      display: flex;
      gap: 5px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(218, 165, 32, 0.35);
      flex-wrap: nowrap;
    }
    .table-msg-select {
      background: #46250f;
      color: #faebd0;
      border: 1px solid #bf8a3b;
      font-family: var(--f-title);
      font-size: 11px;
      padding: 3px 4px;
      border-radius: 2px;
      outline: none;
      width: 105px;
      flex-shrink: 0;
    }
    .table-msg-input {
      flex: 1;
      min-width: 0;
      background: #fff;
      border: 1px solid var(--border-dark);
      padding: 3px 6px;
      font-family: var(--f-body);
      font-size: 13px;
      border-radius: 2px;
      outline: none;
    }
    .table-msg-btn {
      background: #731e0b;
      color: #ffe8b5;
      border: 1px solid #ffd700;
      padding: 3px 8px;
      font-family: var(--f-title);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* BARRA DE ROLES */
    .role-bar-wrap {
      display: flex;
      align-items: center;
      background: #251308;
      padding: 5px 6px;
      border: 2px solid var(--border-gold);
      margin-bottom: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
      gap: 6px;
    }
    .gm-fixed-container {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 6px;
      border-right: 2px solid var(--border-gold);
      flex-shrink: 0;
    }
    .role-bar-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
    }
    .mobile-role-selector-wrap {
      display: none;
      flex: 1;
    }
    .mobile-role-select {
      width: 100%;
      background: #46250f;
      color: #faebd0;
      border: 1.5px solid #bf8a3b;
      font-family: var(--f-title);
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 3px;
      outline: none;
      font-weight: bold;
    }

    .role-btn {
      background: #46250f;
      color: #faebd0;
      border: 1px solid #bf8a3b;
      padding: 5px 8px;
      font-family: var(--f-title);
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
      border-radius: 2px;
      white-space: nowrap;
    }
    .role-btn:hover { background: #6c3a19; color: #fff; }
    .role-btn.active {
      background: #8b1313;
      color: #fff;
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.45);
      font-weight: bold;
    }
    .role-btn.btn-console-tab {
      background: #4a2810;
      border-color: #f59e0b;
      color: #fef08a;
    }
    .role-btn.btn-console-tab.active {
      background: #b45309;
      color: #fff;
      border-color: #fde047;
    }
    .btn-role-settings {
      background: #731e0b;
      color: #ffe8b5;
      border: 1.5px solid #ffd700;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .btn-role-settings:hover {
      background: #942b13;
      transform: rotate(45deg);
    }

    /* BADGE DE SOLO LECTURA */
    .badge-lock-tag {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #f87171;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-family: var(--f-title);
      font-weight: bold;
      margin-left: 6px;
      display: none;
    }

    /* MODALES */
    #hub-modal-backdrop, #history-modal-backdrop, #modal-backdrop, #dice-history-backdrop, #avatar-modal-backdrop, #modal-turn-report, #modal-combat-history {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 16px;
      backdrop-filter: blur(2px);
    }
    .hub-modal-box {
      background: #f5e9d2;
      border: 4px double var(--border-dark);
      outline: 2px solid var(--border-gold);
      outline-offset: -3px;
      padding: 18px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .hub-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 10px 0;
    }
    .hub-btn {
      background: #46250f;
      color: #faebd0;
      border: 1px solid #bf8a3b;
      padding: 8px;
      font-family: var(--f-title);
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .hub-btn:hover { background: #6c3a19; color: #fff; }
    #importFile { display: none; }

    /* MODAL DE REPORTE DE TURNO SUPERIOR (SLIDE DOWN) */
    #modal-turn-report {
      align-items: flex-start !important;
      padding-top: 25px;
    }
    .top-popup-modal-box {
      background: #f5e9d2;
      border: 4px double var(--border-dark);
      outline: 2px solid var(--border-gold);
      outline-offset: -3px;
      width: 95%;
      max-width: 620px;
      border-radius: 4px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.85);
      animation: slideDownModal 0.25s ease-out;
      display: flex;
      flex-direction: column;
      max-height: 85vh;
      overflow: hidden;
    }
    @keyframes slideDownModal {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .top-popup-header {
      background: #2b1810;
      color: #faebd7;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-gold);
    }
    .top-popup-header h3 {
      font-family: var(--f-title);
      font-size: 13px;
      color: #fde047;
      letter-spacing: 0.5px;
    }
    .turn-report-tabs {
      display: flex;
      gap: 4px;
    }
    .report-tab-btn {
      background: #46250f;
      color: #faebd0;
      border: 1px solid var(--border-gold);
      padding: 2px 8px;
      font-family: var(--f-title);
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
    }
    .report-tab-btn.active {
      background: #b45309;
      color: #fff;
      border-color: #ffd700;
      font-weight: bold;
    }
    .top-popup-body {
      padding: 10px 12px;
      overflow-y: auto;
      font-size: 13.5px;
      line-height: 1.4;
      flex: 1;
      text-align: left;
    }
    .top-popup-footer {
      background: #ebd8b6;
      border-top: 1px solid var(--border-dark);
      padding: 8px 12px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-accept-popup {
      background: #731e0b;
      color: #ffe8b5;
      border: 1px solid #ffd700;
      padding: 5px 14px;
      font-family: var(--f-title);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
    }

    /* MODAL DE HISTORIAL DE DAÑOS Y ACCIONES */
    .combat-log-body {
      max-height: 340px;
      overflow-y: auto;
      text-align: left;
      background: #fffdf8;
      border: 1px solid var(--border-dark);
      padding: 8px;
      margin: 10px 0;
      font-size: 13px;
    }
    .combat-log-item {
      padding: 4px 0;
      border-bottom: 1px dotted rgba(60,30,10,0.2);
      line-height: 1.3;
    }

    /* AVATARES */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 12px 0;
      max-height: 250px;
      overflow-y: auto;
      padding: 6px;
      background: rgba(0,0,0,0.05);
      border: 1px solid var(--border-dark);
      border-radius: 4px;
    }
    .avatar-choice-btn {
      background: #fffdf8;
      border: 1.5px solid var(--border-dark);
      border-radius: 4px;
      font-size: 22px;
      padding: 6px 0;
      cursor: pointer;
      transition: transform 0.1s, background 0.1s;
    }
    .avatar-choice-btn:hover {
      transform: scale(1.15);
      background: #fde68a;
      border-color: #b45309;
    }
    .avatar-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fffdf7;
      border: 1.5px solid var(--border-dark);
      padding: 1px 7px;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--f-title);
      font-size: 12px;
      font-weight: bold;
    }

    /* TOAST */
    #toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a1408;
      color: #fbebd0;
      border: 2px solid var(--border-gold);
      padding: 10px 20px;
      font-family: var(--f-title);
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.85);
      z-index: 999999;
      display: none;
      text-align: center;
      border-radius: 4px;
      max-width: 90%;
    }

    .modal-box {
      background: #f5e9d2;
      border: 4px double var(--border-dark);
      outline: 2px solid var(--border-gold);
      outline-offset: -3px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .modal-title {
      font-family: var(--f-title);
      font-size: 17px;
      font-weight: bold;
      color: var(--txt-red);
      margin-bottom: 8px;
    }
    .modal-desc {
      font-family: var(--f-body);
      font-size: 15px;
      color: #2b1608;
      margin-bottom: 16px;
    }
    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn-modal-danger {
      background: #731e0b;
      color: #ffe8b5;
      border: 1px solid #360b02;
      padding: 7px 16px;
      font-family: var(--f-title);
      cursor: pointer;
      font-weight: bold;
    }
    .btn-modal-cancel {
      background: #46250f;
      color: #f7e6c4;
      border: 1px solid #bf8a3b;
      padding: 7px 16px;
      font-family: var(--f-title);
      cursor: pointer;
    }

    /* TÍTULO DE CORRIDO */
    .main-title-wrap {
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px dashed var(--border-gold);
    }
    .main-title-continuous {
      font-family: var(--f-title);
      font-size: clamp(20px, 4.2vw, 36px);
      font-weight: 900;
      color: #381504;
      letter-spacing: 2.5px;
      white-space: nowrap;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.7), 2px 2px 4px rgba(70,30,10,0.3);
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }
    .main-title-sub {
      font-size: 0.58em;
      font-weight: 600;
      color: #7c2d12;
      letter-spacing: 1.5px;
    }

    /* BANNER DE DESEO */
    .world-alteration-banner {
      background: linear-gradient(135deg, rgba(67, 24, 92, 0.15) 0%, rgba(147, 51, 234, 0.08) 50%, rgba(180, 83, 9, 0.12) 100%), var(--bg-box);
      border: 2px solid #7e22ce;
      outline: 1px solid var(--border-gold);
      outline-offset: -3px;
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 12px rgba(126, 34, 206, 0.15), 0 2px 6px rgba(0,0,0,0.15);
      transition: all 0.25s ease;
    }
    .world-alteration-banner.wishes-exhausted {
      background: #e2e8f0 !important;
      border-color: #64748b !important;
      outline-color: #94a3b8 !important;
      box-shadow: none !important;
      filter: grayscale(0.85);
    }
    .world-alteration-banner.wishes-exhausted .world-alteration-title {
      color: #475569 !important;
      border-bottom-color: #94a3b8 !important;
    }
    .world-alteration-banner.wishes-exhausted .world-alteration-badge {
      background: #cbd5e1 !important;
      color: #475569 !important;
      border-color: #94a3b8 !important;
    }

    .world-alteration-title {
      font-family: var(--f-title);
      font-size: 13.5px;
      font-weight: 900;
      color: #581c87;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid rgba(126, 34, 206, 0.3);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .world-alteration-badge {
      font-size: 11px;
      font-weight: bold;
      color: #b45309;
      background: #fef3c7;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid #fde68a;
    }
    .world-alteration-desc {
      font-family: var(--f-body);
      font-size: 12.5px;
      color: #3b1b07;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .world-alteration-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .world-alt-check-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--f-title);
      font-size: 12px;
      font-weight: bold;
      color: #4a044e;
      cursor: pointer;
      background: rgba(255,255,255,0.6);
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid rgba(126, 34, 206, 0.25);
    }
    .world-alt-check-label input {
      width: 16px;
      height: 16px;
      accent-color: #7e22ce;
      cursor: pointer;
    }
    .world-alt-input-wrap {
      display: flex;
      gap: 4px;
      flex: 1;
      min-width: 200px;
    }
    .world-alt-note {
      flex: 1;
      min-width: 120px;
      background: #fff;
      border: 1px solid var(--border-dark);
      padding: 3px 6px;
      font-family: var(--f-body);
      font-size: 13px;
      border-radius: 2px;
      outline: none;
    }
    .btn-confirm-wish {
      background: #581c87;
      color: #f3e8ff;
      border: 1px solid #c084fc;
      padding: 3px 9px;
      font-family: var(--f-title);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap;
    }
    .btn-confirm-wish:hover {
      background: #7e22ce;
      color: #fff;
    }

    .confirmed-wish-card {
      margin-top: 6px;
      background: #faf5ff;
      border: 1px solid #d8b4fe;
      border-left: 3px solid #7e22ce;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .box-frame {
      background: var(--bg-box);
      border: 2px solid var(--border-dark);
      outline: 1px solid rgba(147, 103, 43, 0.5);
      outline-offset: -3px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 10px rgba(90, 45, 15, 0.1);
    }
    .box-frame-title {
      font-family: var(--f-title);
      font-size: 15px;
      font-weight: 700;
      color: #3b1b07;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 4px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .collapsible-header {
      cursor: pointer;
      user-select: none;
    }
    .collapsible-header:hover {
      color: #731e0b;
    }

    .header-info-line {
      display: flex;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 15px;
    }
    .header-info-line label {
      font-family: var(--f-title);
      font-weight: 700;
      font-size: 12.5px;
      min-width: 125px;
      color: #2e1505;
      flex-shrink: 0;
    }
    .header-info-line input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid #6b4421;
      font-family: var(--f-body);
      font-size: 15.5px;
      color: #120a04;
      padding: 2px 4px 4px 4px;
      outline: none;
      min-width: 0;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px dotted rgba(60,30,10,0.25);
      font-size: 14px;
    }
    .action-icon {
      font-weight: bold;
      width: 20px;
      text-align: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .action-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #61220a;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ESTADOS Y EFECTOS ALTERADOS */
    .status-effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 5px;
      margin-top: 8px;
    }
    .status-effect-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      font-size: 12.5px;
      background: rgba(255,255,255,0.65);
      padding: 3px 5px;
      border: 1px solid rgba(60,30,10,0.25);
      border-radius: 3px;
      min-width: 0;
      font-weight: 800;
    }
    .status-effect-item label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 800;
    }
    .status-effect-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #731e0b;
      cursor: pointer;
      flex-shrink: 0;
    }
    .status-inputs-wrap {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .status-val-input {
      width: 38px !important;
      font-size: 12.5px !important;
      font-family: var(--f-body) !important;
      font-weight: 800 !important;
      padding: 1px 2px !important;
      text-align: center;
      border: 1px solid var(--border-dark) !important;
      background: #fff !important;
      border-radius: 2px;
    }
    .status-turn-input {
      width: 28px !important;
      font-size: 11px !important;
      font-family: var(--f-body) !important;
      font-weight: 800 !important;
      padding: 1px !important;
      text-align: center;
      border: 1px dashed var(--border-gold) !important;
      background: #fffdf8 !important;
      border-radius: 2px;
    }

    /* BARRAS DE VIDA Y SMATH */
    .stat-bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .stat-bar-track {
      flex: 1;
      height: 9px;
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--border-dark);
      border-radius: 5px;
      overflow: hidden;
      min-width: 50px;
    }
    .stat-bar-fill-hp {
      height: 100%;
      background: linear-gradient(90deg, #b91c1c 0%, #22c55e 100%);
      width: 0%;
      transition: width 0.35s ease;
    }
    .stat-bar-fill-smath {
      height: 100%;
      background: linear-gradient(90deg, #d97706 0%, #fbbf24 100%);
      width: 0%;
      transition: width 0.35s ease;
    }

    /* ESTADÍSTICAS DE COMBATE */
    .combat-stat-card {
      background: #fdfaf3;
      border: 1.5px solid rgba(60,30,10,0.22);
      border-radius: 4px;
      padding: 7px 10px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .combat-stat-card.card-resource-hp { border-left: 5px solid #7c1414; }
    .combat-stat-card.card-resource-smath { border-left: 5px solid #b45309; }
    .combat-stat-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .combat-stat-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--f-title);
      font-size: 13px;
      font-weight: bold;
    }
    .combat-stat-formula-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .combat-stat-formula-row input {
      width: 44px;
      padding: 2px;
      font-size: 14px;
      font-weight: bold;
      font-family: var(--f-body);
      text-align: center;
      border: 1.5px solid var(--border-dark);
      background: #fff;
      border-radius: 2px;
    }
    .combat-stat-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 65px;
      text-align: right;
    }
    .combat-stat-total-badge {
      font-family: var(--f-body);
      font-size: 22px;
      font-weight: bold;
      color: var(--txt-red);
      line-height: 1;
    }
    .combat-stat-total-badge small {
      font-size: 12px;
      font-family: var(--f-title);
      color: var(--txt-gold);
      display: block;
    }
    .calc-tag {
      font-family: var(--f-title);
      font-size: 11px;
      color: #643207;
      margin: 0 1px;
    }
    .btn-stat-max {
      background: #46250f;
      color: #ffe8b5;
      border: 1px solid #bf8a3b;
      font-family: var(--f-title);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* TABLA D6 GUÍA */
    .d6-table-wrap { width: 100%; margin-top: 10px; }
    .d6-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      border: 2px solid var(--border-dark);
      background: #faf4e3;
      table-layout: fixed;
    }
    .d6-table th, .d6-table td {
      border: 1px solid var(--border-dark);
      padding: 4px 2px;
      word-break: break-word;
    }
    .d6-table th {
      font-family: var(--f-title);
      font-size: 12px;
      background: #dfc89d;
      color: #2b1305;
    }
    .row-tirada { background: #eedfc2; }
    .row-mult { font-size: 12px; color: #5a2c0f; }
    .row-damage { background: #fffcf4; font-size: 16px; color: var(--txt-red); font-weight: bold; }
    
    .active-column {
      background-color: #ffd875 !important;
      box-shadow: inset 0 0 0 3px #a36500;
      font-weight: 900 !important;
    }

    /* INICIATIVA Y D20 */
    .shared-roll-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #eedfc2;
      border: 1.5px solid var(--border-dark);
      border-radius: 3px;
      padding: 6px;
      margin-bottom: 8px;
    }
    .roll-subpanel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: rgba(255,255,255,0.4);
      padding: 4px 6px;
      border: 1px solid rgba(60,30,10,0.2);
      border-radius: 2px;
      font-family: var(--f-title);
      font-size: 11.5px;
    }

    /* ARMAS */
    .weapons-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 4px;
    }
    .weapon-card {
      background: #dcbe92;
      border: 1.5px solid var(--border-dark);
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-radius: 4px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.12);
    }
    .weapon-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .weapon-name-input {
      flex: 1;
      height: 28px;
      background: #fff;
      border: 1.5px solid var(--border-dark);
      font-family: var(--f-body);
      font-size: 14.5px;
      font-weight: bold;
      padding: 0 6px;
      border-radius: 2px;
      outline: none;
    }
    .btn-roll-weapon {
      padding: 5px 10px;
      background: #731e0b;
      color: #ffe8b5;
      font-family: var(--f-title);
      font-size: 12px;
      font-weight: bold;
      border: 1.5px solid #360b02;
      cursor: pointer;
      border-radius: 2px;
      text-align: center;
    }
    .btn-del-weapon {
      background: none;
      border: none;
      color: #7f1d1d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
    }

    /* ESENCIA */
    .essence-embedded-wrap {
      padding-bottom: 6px;
      text-align: center;
    }
    .essence-embedded-title {
      font-family: var(--f-title);
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #4f250b;
      letter-spacing: 1px;
    }
    .essence-activation-bar {
      background: rgba(0,0,0,0.06);
      border: 1.5px solid var(--border-dark);
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-family: var(--f-title);
      font-size: 11px;
    }
    .essence-modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      text-align: left;
    }
    .essence-act-mode {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .essence-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .essence-row-2 {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .essence-tier-card {
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(147, 103, 43, 0.4);
      border-radius: 4px;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .essence-tier-circles {
      display: flex;
      justify-content: center;
      gap: 3px;
      width: 100%;
    }
    .essence-seal {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1.5px solid var(--border-dark);
      background: #fbf7ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-title);
      font-size: 12.5px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .essence-seal.active {
      background: #731e0b;
      color: #ffe8b5;
      border-color: #ffd700;
      box-shadow: 0 0 5px #d97706;
    }
    .essence-tier-label {
      font-family: var(--f-title);
      font-size: 9.5px;
      font-weight: bold;
      color: #583c14;
      text-transform: uppercase;
    }
    .aspects-container-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1.5px dashed var(--border-gold);
    }
    .aspect-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px dotted rgba(0,0,0,0.18);
      font-size: 12.5px;
      font-family: var(--f-title);
    }
    .aspect-diamonds {
      display: flex;
      gap: 6px;
    }
    .aspect-diamonds input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #8a2be2;
      cursor: pointer;
    }

    /* ARQUETIPOS Y MOCHILA */
    .archetypes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .archetype-box {
      border: 2px solid var(--border-dark);
      padding: 8px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
    }
    .arch-impulsor { background: rgba(220, 60, 40, 0.12); border-color: #8c2415; }
    .arch-controlador { background: rgba(30, 90, 160, 0.12); border-color: #174273; }
    .arch-perpetuador { background: rgba(130, 80, 40, 0.12); border-color: #573516; }
    .arch-proyector { background: rgba(50, 130, 60, 0.12); border-color: #1f5e26; }
    .arch-evocador { background: rgba(220, 150, 20, 0.15); border-color: #855b08; }
    .arch-conmutador { background: rgba(120, 50, 140, 0.12); border-color: #551c66; }

    .arch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid currentColor;
      padding-bottom: 5px;
      margin-bottom: 6px;
    }
    .arch-title-text {
      font-family: var(--f-title);
      font-size: 14.5px;
      font-weight: bold;
    }
    .arch-diamonds-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 2px 4px;
      background: rgba(0,0,0,0.06);
      border-radius: 4px;
    }
    .arch-diamond {
      width: 11px;
      height: 11px;
      border: 1.5px solid currentColor;
      background: rgba(255, 255, 255, 0.7);
      transform: rotate(45deg);
      cursor: pointer;
      display: inline-block;
    }
    .arch-diamond.active { background: currentColor; }

    .skill-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3.5px 0;
      border-bottom: 1px dotted rgba(0,0,0,0.18);
      gap: 4px;
    }
    .skill-name {
      flex: 1;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .skill-boxes {
      display: flex;
      gap: 8px;
    }
    .skill-boxes input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #3b1807;
    }
    .skill-bonus-tag {
      width: 34px;
      text-align: center;
      font-family: var(--f-title);
      font-size: 12px;
      font-weight: bold;
      padding: 1px 0;
      background: #dfcb9f;
      border: 1px solid var(--border-dark);
      color: #553112;
      border-radius: 3px;
    }
    .skill-bonus-tag.has-bonus { background: #731e0b; color: #ffe8b5; }

    .inventory-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }
    .inventory-table th, .inventory-table td {
      border: 1px solid var(--border-dark);
      padding: 4px 3px;
      font-size: 14px;
    }
    .inventory-table th {
      background: #dfcb9f;
      font-family: var(--f-title);
      font-size: 12px;
      text-align: center;
    }
    .inventory-table textarea {
      width: 100%;
      background: transparent;
      border: none;
      font-family: var(--f-body);
      font-size: 14px;
      resize: none;
    }
    .btn-add-item {
      background: #442813;
      color: #fff;
      border: 1px solid #c9933e;
      padding: 5px 10px;
      font-family: var(--f-title);
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
    }

    /* ESTILOS TÁCTICOS ADICIONALES */
    .btn-sound-toggle {
      background: #2a1408;
      border: 1px solid var(--border-gold);
      color: #fde047;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--f-title);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .enemy-card.target-selected, .gm-player-card.target-selected {
      border-color: #b91c1c !important;
      box-shadow: 0 0 10px #dc2626 !important;
      background: #fff5f5 !important;
    }
  </style>
</head>
<body>

  <!-- MODALES Y MENÚS -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title" id="modal-title-text">⚠️ REINICIAR FICHA</div>
      <div class="modal-desc" id="modal-desc-text">¿Estás seguro de que deseas limpiar esta hoja?</div>
      <div class="modal-buttons">
        <button type="button" class="btn-modal-danger" id="modal-confirm-btn" onclick="executeModalAction()">Confirmar</button>
        <button type="button" class="btn-modal-cancel" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="hub-modal-backdrop" class="modal-backdrop">
    <div class="hub-modal-box">
      <div class="modal-title" style="color:#3b1b07;">⚙️ MENÚ DE OPCIONES</div>
      <div class="hub-actions-grid">
        <button type="button" class="hub-btn" onclick="addNewPlayer(); closeHubModal();">➕ Nuevo PJ</button>
        <button type="button" class="hub-btn" onclick="saveActivePlayerToCloud(false); closeHubModal();">🔄 Sincronizar</button>
        <button type="button" class="hub-btn" onclick="exportJSON(); closeHubModal();">💾 Exportar</button>
        <label for="importFile" class="hub-btn" style="margin:0;">📂 Importar</label>
        <input type="file" id="importFile" accept=".json" onchange="importJSON(event); closeHubModal();">
        <button type="button" class="hub-btn" onclick="window.print(); closeHubModal();">🖨️ Imprimir</button>
        <button type="button" class="hub-btn" onclick="closeHubModal(); openResetModal();">🗑️ Reiniciar</button>
      </div>
      <button type="button" class="btn-modal-cancel" onclick="closeHubModal()" style="width:100%; margin-top:8px;">Cerrar Menú</button>
    </div>
  </div>

  <div id="toast-msg"></div>

  <div class="sheet-container">

    <!-- BARRA DE ESTADO Y UNIFICACIÓN DE IDENTIDAD -->
    <div class="status-bar">
      <div class="status-left-wrap">
        <span>🔥 Réquiem Smithnas</span>
        <button type="button" id="btn-toggle-sound" class="btn-sound-toggle" onclick="toggleAudioMute()">
          <span id="sound-icon">🔔</span> <span id="sound-label">Sonido</span>
        </button>
      </div>
      <div class="status-badge">
        <span class="status-dot" id="live-dot"></span>
        <span id="live-status-text">Conectando...</span>
      </div>
    </div>

    <!-- BANNER DE MENSAJES Y CHAT -->
    <div class="objective-banner">
      <div class="objective-header">
        <span class="objective-header-title">🎯 MENSAJES DE MESA</span>
      </div>
      <div id="pinned-msg-wrap" class="pinned-msg-box" style="display:none;">
        <div><span class="pinned-msg-label">📌 FIJADO:</span> <span id="pinned-msg-text"></span></div>
      </div>
      <div id="latest-objectives-container" class="latest-objectives-list">
        <div class="objective-row"><span class="obj-text" style="color:#aaa; font-style:italic;">Sin mensajes activos.</span></div>
      </div>
      <div class="table-msg-composer">
        <select id="table-msg-sender" class="table-msg-select"></select>
        <input type="text" id="table-msg-input" class="table-msg-input" placeholder="Escribe un mensaje o elige tu identidad..." onkeydown="if(event.key==='Enter') broadcastTableMessage(false)">
        <button type="button" class="table-msg-btn" onclick="broadcastTableMessage(false)">Enviar</button>
      </div>
    </div>

    <!-- BARRA DE ROLES -->
    <div class="role-bar-wrap">
      <div class="gm-fixed-container">
        <button type="button" id="gm-role-btn" class="role-btn" onclick="switchRole('gm')">👑 Resumen GM</button>
        <button type="button" id="gm-console-btn" class="role-btn btn-console-tab" onclick="switchRole('console')">🛠️ Consola GM</button>
      </div>
      <div class="role-bar-tabs" id="role-bar-container"></div>
      <button type="button" class="btn-role-settings" onclick="openHubModal()">⚙️</button>
    </div>

    <!-- FICHA PRINCIPAL DEL JUGADOR -->
    <main id="player-sheet-wrap" class="sheet-content-area">
      <h1 class="main-title-wrap">
        <span class="main-title-continuous">
          <span>RÉQUIEM</span> <span class="main-title-sub">DE LOS</span> <span>SMITHNAS</span>
        </span>
      </h1>

      <div class="grid-2col">
        <div class="box-frame">
          <div class="box-frame-title">Datos del Personaje</div>
          <div class="header-info-line"><label>NOMBRE:</label><input type="text" id="char-name" oninput="syncToFirebaseDebounced()"></div>
          <div class="header-info-line"><label>RAZA:</label><input type="text" id="char-raza" oninput="syncToFirebaseDebounced()"></div>
          <div class="header-info-line"><label>OFICIO:</label><input type="text" id="char-oficio" oninput="syncToFirebaseDebounced()"></div>
        </div>
        <div class="box-frame">
          <div class="box-frame-title">Acciones por Turno</div>
          <div class="action-row"><span><b>Atacar</b></span><input type="checkbox" id="act-atacar"></div>
          <div class="action-row"><span><b>Defenderse</b></span><input type="checkbox" id="act-def"></div>
        </div>
      </div>
    </main>

  </div>

  <script>
    // ========================================================
    // LÓGICA GENERAL Y CONEXIÓN EN VIVO FIREBASE
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyClIcL0oWN92Jkl1Npt7gtFQ8QTAqPucNk",
      authDomain: "requiem-hoja.firebaseapp.com",
      databaseURL: "https://requiem-hoja-default-rtdb.firebaseio.com",
      projectId: "requiem-hoja",
      storageBucket: "requiem-hoja.firebasestorage.app",
      messagingSenderId: "282201885402",
      appId: "1:282201885402:web:3e4df71ee4ff974039b3e3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref('smithnas_session');

    let playerList = ['p1', 'p2', 'p3', 'p4'];
    let allPlayersData = { p1: {}, p2: {}, p3: {}, p4: {} };
    let activeRole = 'p1';
    let activeClientIdentity = localStorage.getItem('requiem_client_identity') || 'gm';
    let objectivesList = [];
    let audioMuted = localStorage.getItem('requiem_audio_muted') === 'true';

    function showToast(text) {
      const el = document.getElementById('toast-msg');
      if (!el) return;
      el.innerText = text;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function updateSenderSelect() {
      const select = document.getElementById('table-msg-sender');
      if (!select) return;
      select.innerHTML = '<option value="👑 Master">👑 Master</option>';
      playerList.forEach((pid, index) => {
        const opt = document.createElement('option');
        opt.value = `Jugador ${index + 1}`;
        opt.innerText = `🛡️ Jugador ${index + 1}`;
        select.appendChild(opt);
      });
    }

    function broadcastTableMessage(isPinned = false) {
      const input = document.getElementById('table-msg-input');
      const senderSel = document.getElementById('table-msg-sender');
      const text = (input?.value || '').trim();
      if (!text) return;
      
      objectivesList.unshift({
        id: 'msg_' + Date.now(),
        sender: senderSel?.value || 'Master',
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      input.value = '';
      showToast('💬 Mensaje enviado a la mesa.');
    }

    function toggleAudioMute() {
      audioMuted = !audioMuted;
      localStorage.setItem('requiem_audio_muted', audioMuted);
      showToast(audioMuted ? '🔕 Silenciado.' : '🔔 Sonido activo.');
    }

    function openHubModal() { document.getElementById('hub-modal-backdrop').style.display = 'flex'; }
    function closeHubModal() { document.getElementById('hub-modal-backdrop').style.display = 'none'; }
    function openResetModal() { document.getElementById('modal-backdrop').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal-backdrop').style.display = 'none'; }
    function executeModalAction() { closeModal(); showToast('Ficha reiniciada.'); }

    function switchRole(roleId) {
      activeRole = roleId;
      showToast(`Cambiado a: ${roleId}`);
    }

    function syncToFirebaseDebounced() {
      gameRef.set({ playerList, characters: allPlayersData, objectives: objectivesList });
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateSenderSelect();
      switchRole('p1');
    });
  </script>
</body>
</html>
